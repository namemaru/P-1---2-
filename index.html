<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ผจญภัยปิดเทอม ป.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2b3a;--mute:#6b6b7b;--line:#f0e2c8;--th:#e2574c;--ma:#2fa86b;--fl:#8b5cf6;--pj:#f29a1f;--rv:#3b82f6;--sky:#dff3ff;--gold:#f6b800}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","TH Sarabun New","Leelawadee UI",system-ui,sans-serif;font-size:18px}
h1,h2,h3,.fun{font-family:"Itim","Sarabun","Leelawadee UI",sans-serif;font-weight:400}
button{font:inherit;cursor:pointer}
#app{max-width:980px;margin:0 auto;padding:12px 14px 80px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.btn{border:0;border-radius:16px;padding:12px 22px;font-size:20px;font-weight:700;color:#fff;background:var(--rv);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:17px;padding:8px 14px}
.btn.big{font-size:26px;padding:16px 34px}
.hero{text-align:center;padding:40px 10px}
.hero .owl{font-size:96px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.hero h1{font-size:clamp(34px,7vw,56px);margin:6px 0;color:#d9480f}
.hero p{color:var(--mute);margin:0 0 20px}
input.name{font:inherit;font-size:22px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);text-align:center;width:min(320px,90%);margin-bottom:16px}
.week{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin:14px 0}
.week h2{margin:0;font-size:24px}.week p{margin:2px 0 10px;color:var(--mute)}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:560px){.nodes{grid-template-columns:repeat(3,1fr)}}
.node{position:relative;border:0;border-radius:20px;padding:10px 4px;background:var(--sky);color:var(--ink);text-align:center;box-shadow:0 4px 0 #b9dcef}
.node:nth-child(even){transform:translateY(10px)}
.node b{display:block;font-family:Itim,sans-serif;font-size:30px;line-height:1.1}
.node small{display:block;font-size:14px;color:var(--mute)}
.node .st{font-size:14px;font-weight:700}
.node.hol{background:#ffe7d6;box-shadow:0 4px 0 #f3c3a2}
.node.done{background:#d9f7e6;box-shadow:0 4px 0 #9bd8b6}
.node.lock{background:#eee;box-shadow:0 4px 0 #ccc;color:#999;cursor:not-allowed}
.node.today{outline:4px solid var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{50%{outline-color:#ffe28a}}
.stations{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.stations{grid-template-columns:1fr 1fr}}
.station{background:var(--card);border-radius:22px;padding:16px;border:3px solid var(--c);display:flex;flex-direction:column;gap:8px}
.station h3{margin:0;color:var(--c);font-size:26px}
.station p{margin:0;color:var(--mute);font-size:16px}
.station .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.stars{font-size:22px;letter-spacing:2px}
.mission{background:#fff3df;border:2px dashed var(--pj);border-radius:16px;padding:12px;font-size:17px}
.qwrap{background:var(--card);border-radius:26px;padding:18px;border:3px solid var(--c);text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:#e5e5e5}
.dots i.ok{background:var(--ma)}.dots i.no{background:var(--th)}.dots i.cur{outline:3px solid var(--c)}
.prompt{font-size:clamp(24px,4.6vw,34px);line-height:1.45;margin:6px 0 12px}
.prompt b{color:var(--c)}
.visual{font-size:clamp(34px,7vw,52px);line-height:1.3;margin:6px 0 14px;min-height:10px}
.story{font-size:22px;line-height:1.7;background:#f7f5ff;border-radius:16px;padding:12px 16px;text-align:left;margin-bottom:10px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.choice{border:3px solid var(--line);background:#fff;border-radius:20px;padding:14px 8px;font-size:clamp(24px,5vw,34px);min-height:78px;color:var(--ink);font-family:"Sarabun","Leelawadee UI",sans-serif;font-weight:600;box-shadow:0 4px 0 var(--line)}
.choice.sm{font-size:clamp(19px,3.6vw,24px)}
.choice.right{background:#d9f7e6;border-color:var(--ma)}
.choice.wrong{background:#ffe1de;border-color:var(--th);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.choice:disabled{cursor:default}
.say{border:0;background:var(--sky);border-radius:50%;width:52px;height:52px;font-size:26px}
.fb{margin-top:14px;font-size:24px;min-height:36px}
.fb .ex{display:block;font-size:19px;color:var(--mute);margin-top:4px}
.sw{display:inline-block;width:90px;height:90px;border-radius:50%;border:3px solid #ccc;vertical-align:middle}
.coin{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;font-family:Sarabun,sans-serif;margin:4px;vertical-align:middle;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.c1{width:46px;height:46px;background:#d9d9d9;font-size:20px}.c5{width:56px;height:56px;background:#c9c9c9;font-size:22px}
.c10{width:64px;height:64px;background:radial-gradient(#e9c46a 55%,#cfcfcf 56%);font-size:24px}
.bundle{display:inline-flex;gap:2px;padding:4px;border:3px solid #b45309;border-radius:8px;margin:4px;vertical-align:middle}
.bundle i,.stick{display:inline-block;width:6px;height:56px;background:#f4a261;border-radius:3px}
.stick{margin:4px 3px;vertical-align:middle}
.ten{display:inline-grid;grid-template-columns:repeat(5,auto);gap:2px 6px;margin:0 6px;vertical-align:middle}
.x{position:relative;opacity:.45}.x::after{content:"✕";position:absolute;left:0;right:0;color:#e2574c;font-size:.9em}
.bar{height:22px;border-radius:11px;margin:10px auto}
.seesaw{position:relative;width:300px;height:150px;margin:0 auto}
.plank{position:absolute;left:10px;right:10px;top:90px;height:10px;background:#8d6e63;border-radius:5px;display:flex;justify-content:space-between;align-items:flex-end}
.plank span{font-size:52px;margin-bottom:6px}
.tri{position:absolute;left:130px;top:100px;width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:40px solid #5d4037}
.picto{display:inline-block;text-align:left;font-size:30px;line-height:1.5}
.picto td{padding:0 10px}
.res{text-align:center;padding:24px}
.res .big{font-size:80px}
.confetti{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2b2b3a;color:#fff;padding:10px 18px;border-radius:12px;z-index:10;font-size:17px;max-width:90%}
table.prog{border-collapse:collapse;width:100%;background:#fff;font-size:16px}
table.prog th,table.prog td{border:1px solid var(--line);padding:6px;text-align:center}
table.prog th{background:#fff1d6}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 18px;margin:12px 0}
.card ul{margin:6px 0;padding-left:22px}.card li{margin:3px 0}
.cert{background:#fffdf5;border:10px double var(--gold);border-radius:20px;padding:30px;text-align:center}
.cert h1{color:#b7791f;font-size:44px;margin:0}
.cert .nm{font-family:Itim,sans-serif;font-size:46px;color:#d9480f;margin:12px 0}
@media print{.noprint{display:none!important}body{background:#fff}}
/* ===== ตัวการ์ตูนอนิเมะ + บับเบิลมังงะ + สนับสนุนผู้จัดทำ ===== */
.msc{display:inline-block;vertical-align:bottom;flex:none}.msc svg{display:block;width:100%;height:100%}
.bob{animation:bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.node.today{animation:none}}
.cast{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-bottom:6px}
.bub{position:relative;display:inline-block;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 18px;font-family:Itim,Sarabun,sans-serif;font-size:24px;line-height:1.3;text-align:left}
.bub::before{content:"";position:absolute;left:-17px;top:50%;margin-top:-10px;border-style:solid;border-width:10px 17px 10px 0;border-color:transparent var(--ink) transparent transparent}
.bub::after{content:"";position:absolute;left:-12px;top:50%;margin-top:-7px;border-style:solid;border-width:7px 12px 7px 0;border-color:transparent #fff transparent transparent}
.shout{position:relative;display:inline-block;padding:26px 40px;font-family:Itim,Sarabun,sans-serif;font-size:28px;color:var(--ink)}
.shout svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shout polygon{fill:#ffe28a;stroke:var(--ink);stroke-width:3px;stroke-linejoin:round}
.shout span{position:relative;white-space:nowrap}
.fbm{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}
.fbm .say2{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.fbm .ex{margin-left:8px}
.sup{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sup-btn{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 14px 4px 6px;box-shadow:0 4px 0 var(--ink)}
.sup-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.sup-panel{position:relative;width:290px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px 16px 16px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.sup-panel[hidden]{display:none}
.sup-head{display:flex;align-items:center;justify-content:center;gap:6px;padding-right:26px;font-family:Itim,Sarabun,sans-serif;font-size:20px;white-space:nowrap}
.sup-panel p{margin:6px 0 10px;font-size:15px;line-height:1.45}
.sup-panel small{display:block;font-size:13px;color:var(--mute)}
.sup-qr{display:block;width:190px;height:190px;margin:0 auto 8px;border-radius:12px;border:2px solid var(--line);image-rendering:pixelated}
.sup-x{position:absolute;top:8px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);font-size:15px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media print{.sup{display:none!important}}

</style></head><body><div id="app"></div>
<script>
/* ===== แผน 20 วัน (จากแผนการเรียนรู้ปิดเทอม) ===== */

const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mc(ans,pool,n=4){const s=[ans];for(const x of shuf(pool)){if(s.length>=n)break;if(!s.some(y=>String(y)===String(x)))s.push(x)}return shuf(s)}
function nc(ans,min=0,max=100){const p=[ans+1,ans-1,ans+2,ans-2,ans+3,ans-3,ans+10,ans-10].filter(x=>x>=min&&x<=max);return mc(ans,p)}
const rep=(e,n)=>Array(n).fill(e).join("");
function tenFrame(e,n,cross=0){let h="";for(let k=0;k<n;k+=10){const m=Math.min(10,n-k);h+=`<span class="ten">${Array.from({length:m},(_,i)=>`<span class="${k+i>=n-cross?'x':''}">${e}</span>`).join("")}</span>`}return h}

    if (mood === "cheer" || mood === "happy") s += '<path d="M90 124 L110 124 L100 134 Z" fill="' + GOLD + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/><path d="M92 136 L108 136 L100 144 Z" fill="' + GOLD + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>';
    else s += '<path d="M90 124 L110 124 L100 140 Z" fill="' + GOLD + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>';
    // explorer scarf
    s += '<path d="M54 146 Q100 166 146 146 L142 160 Q100 180 58 160 Z" fill="#3b82f6" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round"/>';
    s += '<path d="M128 160 L140 186 L120 176 Z" fill="#3b82f6" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round"/>';
    s += limb(w[0], 20, BODY) + limb(w[1], 20, BODY);

  }
  function makeMascotSVG(character, mood) {
    character = C[character] ? character : "hoot";
    mood = ARMS[mood] ? mood : "happy";
    var body = character === "hoot" ? owl(mood) : human(character, mood);
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="' + C[character].name + '">' + body + extras(mood) + "</svg>";
  }
  return { makeMascotSVG: makeMascotSVG, CHARACTERS: C, MOODS: ["happy", "cheer", "think", "wave"] };
})();

 <div class="sup-head">${msc("hoot","happy",56)}<span>สนับสนุนผู้จัดทำ 💛</span></div><p>ถ้าเกมนี้ช่วยให้ลูกสนุกกับการเรียน ร่วมเลี้ยงกาแฟผู้จัดทำได้ตามใจเลยค่ะ</p>
 <img class="sup-qr" src="${SUPPORT_QR}" alt="QR PromptPay สำหรับสนับสนุนผู้จัดทำ"><small>สแกนด้วยแอปธนาคาร · PromptPay · รับเงินได้จากทุกธนาคาร</small><p style="font-weight:600;margin-bottom:0">ขอบคุณที่ช่วยให้มีเกมใหม่ ๆ ต่อไปค่ะ 🙏</p></div>
 <button class="sup-btn" onclick="const p=document.getElementById('supP');p.hidden=!p.hidden">${msc("hoot","wave",34)}<span>สนับสนุนผู้จัดทำ</span></button></div>`}
/* ===== screens ===== */
function home(){Q=null;const back=!!S.name;
 app.innerHTML=`<div class="hero"><div class="cast">${msc("ton","wave",110)}${msc("hoot","happy",150,1)}${msc("nid","cheer",110)}</div><h1>ผจญภัยปิดเทอม ป.1</h1><p>20 ด่าน · 4 เกาะ · ภาษาไทย คณิต อังกฤษ จีน และโครงงาน<br>เริ่ม อ. 6 ต.ค. – จ. 2 พ.ย. 2569</p>
 ${back?`<p class="fun" style="font-size:26px;color:var(--ink);margin-bottom:12px">สวัสดี ${S.name.replace(/</g,"&lt;")}! มาผจญภัยต่อกัน</p>`:`<input class="name" id="nm" placeholder="ชื่อนักผจญภัย" maxlength="20"><br>`}<button class="btn big" id="go">${back?"ผจญภัยต่อ 🚀":"เริ่มผจญภัย 🚀"}</button>
 <p style="margin-top:24px"><button class="btn ghost" onclick="parentGate()">👪 สำหรับผู้ปกครอง</button></p></div>${supportCorner()}`;
 document.getElementById("go").onclick=()=>{if(!back){const v=document.getElementById("nm").value.trim();if(!v)return toast("พิมพ์ชื่อก่อนนะ");S.name=v;save()}map()};window.scrollTo(0,0)}
const WEEKS=[["🏝️ เกาะที่ 1 สำรวจและทบทวน","โครงงาน: สมุดภาพครอบครัวของฉัน"],["🌱 เกาะที่ 2 เสริมให้แน่น","โครงงาน: นักสืบถั่วงอก"],["🏪 เกาะที่ 3 เชื่อมสู่เทอม 2","โครงงาน: ร้านค้าของหนู"],["📚 เกาะที่ 4 พร้อมเปิดเทอม","โครงงาน: หนังสือเล่มเล็กของฉัน"]];
function map(){Q=null;let h=`<div class="top"><button class="btn ghost" onclick="home()">🏠 หน้าแรก</button><div class="pill">🦉 ${S.name}</div><div class="pill">⭐ ${total()} ดาว</div><button class="btn ghost" onclick="parentGate()">👪 ผู้ปกครอง</button></div>`;
 WEEKS.forEach((w,wi)=>{h+=`<div class="week"><h2>${w[0]}</h2><p>${w[1]}</p><div class="nodes">`;for(let d=wi*5;d<wi*5+5;d++){const P=PLAN[d],lk=!unlocked(d),dn=dayDone(d);
  h+=`<button class="node ${P.hol?"hol":""} ${dn?"done":""} ${lk?"lock":""} ${P.iso===todayISO?"today":""}" ${lk?"":`onclick="day(${d})"`}><b>${lk?"🔒":SPEC[d].boss?"🏆":P.hol?"🎌":d+1}</b><small>${P.date}</small><span class="st">⭐${dayStars(d)}/${dayMax(d)}</span></button>`}h+=`</div></div>`});
 app.innerHTML=h;window.scrollTo(0,0)}
function day(d){Q=null;const P=PLAN[d],sts=stationsOf(d);let h=`<div class="top"><button class="btn ghost" onclick="map()">⬅ แผนที่</button><div class="pill">${P.d} · ${P.date}</div><div class="pill">⭐ ${dayStars(d)}/${dayMax(d)}</div></div><div class="stations">`;
 sts.forEach(s=>{const U=SUB[s.k],st=S.stars[sk(d,s.k)]||0;const desc=s.k==="rv"?"เล่นเกมทบทวนสิ่งที่เรียนมาแล้ว":s.k==="boss"?"ตอบ 10 ข้อจากทุกวิชา ผ่านแล้วรับเกียรติบัตร!":P[s.k];
  h+=`<div class="station" style="--c:${U.c}"><h3>${U.i} ${U.n}</h3><p>📋 ${desc}</p><div class="row"><span class="stars">${starStr(st)}</span><button class="btn" style="background:${U.c}" onclick="play(${d},'${s.k}')">${st?"เล่นอีก":"เล่น"} ▶</button></div></div>`});
 const mt=P.hol?P.t:SPEC[d].boss?"นำเสนอผลงาน 4 โครงงานให้ครอบครัวฟัง แล้วรับเกียรติบัตร":P.pj;
 h+=`<div class="station" style="--c:var(--pj)"><h3>🌟 ภารกิจจริงวันนี้</h3><div class="mission">${mt}</div><div class="row"><span class="stars">${S.mission[d]?"⭐ ได้แล้ว!":"ดาวโบนัส 1 ดวง"}</span>${S.mission[d]?"":`<button class="btn" style="background:var(--pj)" onclick="confirmMission(${d})">ผู้ใหญ่ยืนยัน ✔</button>`}</div></div></div>`;
 if(SPEC[d].boss&&dayDone(d))h+=`<p style="text-align:center;margin-top:18px"><button class="btn big" onclick="cert()">🏅 ดูเกียรติบัตร</button></p>`;
 app.innerHTML=h;window.scrollTo(0,0)}
function gate(cb){const a=R(6,9),b=R(6,9);const v=prompt(`สำหรับผู้ใหญ่: ${a} × ${b} = ?`);if(v===null)return;if(+v===a*b)cb();else toast("คำตอบไม่ถูก ให้ผู้ใหญ่ช่วยนะ")}
function confirmMission(d){gate(()=>{S.mission[d]=true;save();beep(1);confetti(20);day(d)})}
function play(d,k){const st=stationsOf(d).find(s=>s.k===k);const qs=buildSet(st);Q={d,k,qs,i:0,res:[],requeued:new Set(),n:qs.length};showQ()}
function showQ(){const {d,k,qs,i}=Q,q=qs[i],U=SUB[k];
 const dots=Array.from({length:Q.n},(_,j)=>`<i class="${Q.res[j]===true?"ok":Q.res[j]===false?"no":""} ${j===Math.min(i,Q.n-1)&&i<Q.n?"cur":""}"></i>`).join("");
 const lab=q.lab||(x=>x);
 app.innerHTML=`<div class="top"><button class="btn ghost" onclick="day(${d})">⬅ ออก</button><div class="pill">${U.i} ${U.n}</div>${q.say?`<button class="say" onclick='say(${JSON.stringify(q.say[0])},"${q.say[1]}")'>🔊</button>`:"<span></span>"}</div>
 <div class="qwrap" style="--c:${U.c}"><div class="dots">${dots}</div>${i>=Q.n?'<div class="pill" style="display:inline-block;margin-bottom:6px">🔁 ลองข้อที่พลาดอีกครั้ง</div>':""}${q.pre||""}<div class="prompt">${q.p}</div><div class="visual">${q.v||""}</div>
 <div class="choices">${q.c.map((c,j)=>`<button class="choice ${q.sm?"sm":""}" data-j="${j}">${lab(c)}</button>`).join("")}</div><div class="fb" id="fb"></div></div>`;
 app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.j));window.scrollTo(0,0)}
function answer(j){const q=Q.qs[Q.i],ok=String(q.c[j])===String(q.a),bs=app.querySelectorAll(".choice");bs.forEach(b=>b.disabled=true);
 bs[j].classList.add(ok?"right":"wrong");if(!ok)bs[q.c.findIndex(c=>String(c)===String(q.a))].classList.add("right");beep(ok);
 if(Q.i<Q.n)Q.res[Q.i]=ok;if(!ok&&Q.i<Q.n&&!Q.requeued.has(Q.i)){Q.requeued.add(Q.i);Q.qs.push(q)}
